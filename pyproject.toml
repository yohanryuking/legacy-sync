[project]
name = "legacy-sync"
version = "0.1.0"
description = "Pipeline de migracion de datos: legado sucio -> validacion -> carga idempotente -> dashboard en tiempo real."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "faker>=25.0",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
legacy-sync = "legacy_sync.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["legacy_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
